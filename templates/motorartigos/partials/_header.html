{% load static %}

<!-- Topbar Integrada com Navegação e Busca Inline -->
<header class="header-navbar border-bottom border-dark-light py-3">
    <div class="container d-flex flex-column flex-lg-row align-items-center justify-content-between gap-3">
        
        <!-- Logo BOXFÁCIL -->
        <a href="{% url 'index' %}" class="d-flex align-items-center gap-2 text-decoration-none text-nowrap">
            <svg width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="48" height="48" rx="10" fill="#111827" stroke="#1e2640" stroke-width="1.5"/>
                <path d="M24 10L36 17V31L24 38L12 31V17L24 10Z" stroke="#3b82f6" stroke-width="2.2" stroke-linejoin="round"/>
                <path d="M24 24L36 17" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
                <path d="M24 24V38" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M24 24L12 17" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
                <circle cx="24" cy="24" r="3" fill="#60a5fa"/>
            </svg>
            <div class="d-flex flex-column text-start lh-1">
                <span class="fs-5 text-white fw-extrabold tracking-tight" style="font-weight: 800;">
                    BOX<span class="text-primary-custom">FÁCIL 222</span>
                </span>
                <span class="text-secondary" style="font-size: 0.68rem; font-weight: 500;">sua feira perto de você</span>
            </div>
        </a>

        <!-- Barra de Busca Central -->
        <div class="search-container flex-grow-1 w-100 mx-lg-4">
            <form method="GET" action="{% url 'index' %}" class="m-0">
                {% if eixo_selecionado %}
                    <input type="hidden" name="eixo" value="{{ eixo_selecionado }}">
                {% endif %}
                <div class="position-relative">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" 
                           name="busca" 
                           class="search-input" 
                           placeholder="Pesquise por lojas, boxes, produtos ou serviços..." 
                           value="{{ termo_busca|default:'' }}">
                </div>
            </form>
        </div>

        <!-- Badges Oficiais: Android & iOS -->
        <div class="d-flex align-items-center gap-2">
            <a href="https://psul.com.br" class="btn-store-badge text-decoration-none" title="Disponível para Android">
                <i class="fa-brands fa-android fs-5 text-success"></i>
                <div class="d-flex flex-column text-start lh-1">
                    <span class="text-secondary" style="font-size: 0.58rem; text-transform: uppercase;">Baixar App</span>
                    <span class="text-white fw-bold" style="font-size: 0.78rem;">Android</span>
                </div>
            </a>
            
            <a href="https://psul.com.br" class="btn-store-badge text-decoration-none" title="Disponível para iOS">
                <i class="fa-brands fa-apple fs-5 text-white"></i>
                <div class="d-flex flex-column text-start lh-1">
                    <span class="text-secondary" style="font-size: 0.58rem; text-transform: uppercase;">Baixar App</span>
                    <span class="text-white fw-bold" style="font-size: 0.78rem;">iPhone</span>
                </div>
            </a>
        </div>

    </div>
</header>

<!-- Pílulas de Filtros de Categorias (Eixos) -->
<section class="container my-3">
    <div class="filters-wrapper">
        <a href="?{% if termo_busca %}busca={{ termo_busca }}{% endif %}" 
           class="btn-filter text-decoration-none {% if not eixo_selecionado %}active{% endif %}">
            Todos os Boxes
        </a>
        {% for eixo in eixos %}
            <a href="?eixo={{ eixo.id }}{% if termo_busca %}&busca={{ termo_busca }}{% endif %}" 
               class="btn-filter text-decoration-none {% if eixo_selecionado == eixo.id|slugify %}active{% endif %}">
                {{ eixo.nome }}
            </a>
        {% endfor %}
    </div>
</section>
